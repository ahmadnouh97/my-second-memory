[project]
name = "second-memory-backend"
version = "0.1.0"
description = "Second Memory – personal content curation app backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.162.5",
    "uvicorn[standard]==0.32.1",
    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    # Settings
    "pydantic-settings==2.7.0",
    # AI / LLM
    "langchain-groq==1.1.3",
    "langgraph==1.2.21",
    # Embeddings (Google AI Studio)
    "google-genai>=1.0.0",
    "google-api-core>=2.19.0",
    # Metadata extraction
    "yt-dlp>=2025.1.26",
    "trafilatura==2.0.0",
    "beautifulsoup4==4.12.3",
    "requests==2.34.2",
    "lxml==6.1.3",
    # Auth
    "PyJWT>=2.10.1",
    "bcrypt>=4.0.0",
    "email-validator>=2.1.0",
    # Utilities
    "python-multipart==0.0.33",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
